{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Añadir contacto</title>

    <link rel="stylesheet" href="{% static 'contactos/estilos.css' %}">
</head>

<body>

    <div class="form-container">

        <h1>Añadir contacto</h1>

        <form method="post">

            {% csrf_token %}

            {{ formulario.as_p }}

            <div class="form-buttons">

                <button type="submit" class="btn btn-primary">
                    Añadir contacto
                </button>

                <a href="{% url 'inicio' %}" class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</body>

</html>
